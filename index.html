<!DOCTYPE html>
<html>
<head>
  <title>Dog-Friendly Outdoor Spaces Near UMass Amherst</title>

  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

  <style>
    body {
      margin: 0;
    }

    #map {
      height: 100vh;
      width: 100%;
    }
  </style>
</head>

<body>

<div id="map"></div>

<script>

var map = L.map('map').setView([42.3912, -72.5267], 13);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© OpenStreetMap contributors'
}).addTo(map);

L.marker([42.3912, -72.5267]).addTo(map)
    .bindPopup("UMass Amherst");

L.marker([42.4122, -72.5304]).addTo(map)
    .bindPopup("Puffers Pond");

L.marker([42.3976, -72.5034]).addTo(map)
    .bindPopup("Amethyst Brook");

</script>

</body>
</html>
